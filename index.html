<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
<div class="container">
  <h1 class="title">Progress</h1>
  <div class="progress">

  </div>
  <div class="options">
    <div class="option">
      <input id="value" class="option__value" type="text">
      <label for="value" class="option__label">Value</label>
    </div>
    <div class="option">
      <input id="animate" class="option__switch" type="checkbox">
      <label for="animate" class="option__label">Animate</label>
    </div>
    <div class="option">
      <input id="hide" class="option__switch" type="checkbox">
      <label for="hide" class="option__label">Hide</label>
    </div>
  </div>
</div>
</body>
</html>
