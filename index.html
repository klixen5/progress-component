<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./progress/progress.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
<div class="progress-indicator__container">
  <h1 class="progress-indicator__title">Progress</h1>
  <div class="progress-indicator__progress">
    <svg class="progress-indicator__circle-container" viewBox="0 0 100 100">
      <circle
        class="progress-indicator__circle-track"
        cx="50"
        cy="50"
        r="30"
        pathLength="100"
        transform="rotate(-90 50 50)"
      />
      <circle
        class="progress-indicator__circle"
        cx="50"
        cy="50"
        r="30"
        pathLength="100"
        transform="rotate(-90 50 50)"
      />
    </svg>
  </div>
  <div class="progress-indicator__options">
    <div class="progress-indicator__option">
      <input id="value" class="progress-indicator__option__value" type="text" value="60">
      <label for="value" class="progress-indicator__option__label">Value</label>
    </div>
    <div class="progress-indicator__option">
      <input id="animate" class="progress-indicator__option__switch" type="checkbox">
      <label for="animate" class="progress-indicator__option__label">Animate</label>
    </div>
    <div class="progress-indicator__option">
      <input id="hide" class="progress-indicator__option__switch" type="checkbox">
      <label for="hide" class="progress-indicator__option__label">Hide</label>
    </div>
  </div>
</div>
</body>
</html>
